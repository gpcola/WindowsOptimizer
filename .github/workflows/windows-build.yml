name: windows-build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  windows-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Safety gate - never remove Windows features
        shell: pwsh
        run: |
          $compiledSources = @(
            'MainWindow.xaml.cs',
            'MainWindow.QuickClean.cs',
            'MainWindow.MediaStreaming.cs',
            'NetworkOptimizer.cs',
            'Optimizer.cs',
            'CleanupSafety.cs',
            'PowerShellHelper.cs'
          )
          $forbidden = @(
            'Disable-WindowsOptionalFeature',
            'Remove-WindowsCapability',
            'Uninstall-WindowsFeature',
            '/Disable-Feature'
          )
          foreach ($pattern in $forbidden) {
            $match = Select-String -Path $compiledSources -Pattern $pattern -SimpleMatch -ErrorAction SilentlyContinue
            if ($match) {
              $match | ForEach-Object { Write-Host $_ }
              throw "Safety invariant violated: shipped code contains Windows feature-removal command '$pattern'."
            }
          }
          Write-Host 'Safety invariant passed: no Windows feature-removal commands in shipped application code.'

      - name: Safety gate - protect application profiles
        shell: pwsh
        run: |
          $requiredProtections = @(
            '%LOCALAPPDATA%\\Microsoft\\Edge\\User Data',
            '%LOCALAPPDATA%\\Packages',
            '%APPDATA%\\Microsoft\\Protect'
          )
          foreach ($pattern in $requiredProtections) {
            if (-not (Select-String -Path 'CleanupSafety.cs' -Pattern $pattern -SimpleMatch -Quiet)) {
              throw "Cleanup safety invariant violated: missing protected path '$pattern'."
            }
          }

          if (-not (Select-String -Path 'Optimizer.cs' -Pattern 'SearchOption.TopDirectoryOnly' -SimpleMatch -Quiet)) {
            throw 'Cleanup safety invariant violated: temporary-file cleanup must remain top-level only.'
          }

          if (-not (Select-String -Path 'Optimizer.cs' -Pattern 'cleanupSafety.ShouldSkip' -SimpleMatch -Quiet)) {
            throw 'Cleanup safety invariant violated: cleanup candidates must pass the exclusion guard.'
          }

          Write-Host 'Cleanup safety invariant passed: browser/app profiles are protected and temp cleanup remains non-recursive.'

      - name: Safety gate - preserve VPN and adapter compatibility
        shell: pwsh
        run: |
          $networkForbidden = @(
            'Set-DnsClientServerAddress',
            'Set-NetIPInterface',
            'Set-NetAdapterAdvancedProperty',
            'Set-NetAdapterBinding',
            'Restart-NetAdapter',
            'Disable-NetAdapter',
            'New-NetFirewallRule',
            'Remove-NetFirewallRule'
          )
          foreach ($pattern in $networkForbidden) {
            $match = Select-String -Path 'NetworkOptimizer.cs' -Pattern $pattern -SimpleMatch -ErrorAction SilentlyContinue
            if ($match) {
              $match | ForEach-Object { Write-Host $_ }
              throw "Network safety invariant violated: NetworkOptimizer contains '$pattern'."
            }
          }
          Write-Host 'Network safety invariant passed: DNS, MTU/IP interface, bindings, vendor properties, firewall and forced adapter restarts are untouched.'

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not install Inno Setup 6 (exit $LASTEXITCODE)."
            }
          }

      - name: Restore
        run: dotnet restore WindowsOptimizer.csproj

      - name: Build
        run: dotnet build WindowsOptimizer.csproj -c Release --no-restore

      - name: Publish self-contained release and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\Build-WindowsOptimizer.ps1 -Publish -SelfContained -Installer

      - name: Validate publish executable exists
        shell: pwsh
        run: |
          $exePath = 'publish\win-x64\Release\WindowsOptimizer.exe'
          if (-not (Test-Path $exePath)) {
            throw "Missing compiled executable: $exePath"
          }
          if ((Get-Item $exePath).Length -le 0) {
            throw "Compiled executable is empty: $exePath"
          }

      - name: Validate portable release archive
        shell: pwsh
        run: |
          $zipPath = 'artifacts\releases\WindowsOptimizer-win-x64-Release-self-contained.zip'
          $checksumPath = "$zipPath.sha256"
          if (-not (Test-Path $zipPath)) {
            throw "Missing release zip: $zipPath"
          }
          if (-not (Test-Path $checksumPath)) {
            throw "Missing SHA256 file: $checksumPath"
          }

      - name: Validate installer
        shell: pwsh
        run: |
          $installerPath = 'artifacts\installer\WindowsOptimizer-Setup-win-x64.exe'
          $checksumPath = "$installerPath.sha256"
          if (-not (Test-Path $installerPath)) {
            throw "Missing installer: $installerPath"
          }
          if ((Get-Item $installerPath).Length -le 0) {
            throw "Installer is empty: $installerPath"
          }
          if (-not (Test-Path $checksumPath)) {
            throw "Missing installer SHA256 file: $checksumPath"
          }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizer-win-x64-release
          path: |
            artifacts/releases/WindowsOptimizer-win-x64-Release-self-contained.zip
            artifacts/releases/WindowsOptimizer-win-x64-Release-self-contained.zip.sha256
            artifacts/installer/WindowsOptimizer-Setup-win-x64.exe
            artifacts/installer/WindowsOptimizer-Setup-win-x64.exe.sha256
          if-no-files-found: error
